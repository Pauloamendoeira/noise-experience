name: Patch NOISE executive demo

on:
  push:
    paths:
      - '.github/workflows/patch-noise-demo.yml'

permissions:
  contents: write

jobs:
  patch-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply MVP funnel adjustments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  '<div style="color:#67e5d1">Brasil S.A. · MVP</div>',
                  '<div style="color:#67e5d1">Brasil S.A. · Teste de decisão sob pressão</div>'
              ),
              (
                  '<p>Você assume a gestão de uma empresa em operação. Ajuste onde coloca atenção e recursos e tome decisões diante dos eventos. O tempo avança e cada escolha altera caixa, receita, capacidade e saúde da organização.</p>\n    <p><b>O objetivo não é simplesmente crescer. É crescer sem criar uma empresa incapaz de sustentar o próprio crescimento.</b></p>',
                  '<h2 style="font-size:28px;line-height:1.08;margin:2px 0 10px">Você sabe administrar uma empresa. Mas sabe como decide quando a pressão aumenta?</h2>\n    <p>Assuma uma empresa no Brasil. Em seis decisões, o NOISE identifica padrões e pontos cegos que normalmente só aparecem quando já viraram custo.</p>\n    <p><b>O objetivo não é acertar tudo. É revelar como você decide quando crescimento, caixa, pessoas, tecnologia e risco começam a competir pela sua atenção.</b></p>'
              ),
              (
                  '<p style="font-size:11px"><b>Importante:</b> nem todo efeito aparece imediatamente. O NOISE observa padrões, desequilíbrios e consequências acumuladas enquanto você joga.</p>',
                  '<p style="font-size:11px"><b>Importante:</b> nem todo efeito aparece imediatamente. O NOISE observa coerência, pressão, capacidade, risco e consequências acumuladas enquanto você decide.</p>'
              ),
              (
                  '<button class="start" onclick="startGame()">COMEÇAR SIMULAÇÃO</button>',
                  '<button class="start" onclick="startGame()">TESTAR MINHAS DECISÕES</button>'
              ),
              (
                  '<button onclick="alert(\'MVP: aqui entra o agendamento da conversa inicial.\')">AGENDAR UMA CONVERSA INICIAL</button>',
                  '<button onclick="window.open(\'https://wa.me/5521987118111?text=Paulo%2C%20fiz%20o%20NOISE%20Experience.%20Quero%20entender%20melhor%20o%20que%20apareceu%20no%20meu%20Snapshot.\', \'_blank\')">QUERO ENTENDER MEUS BLIND SPOTS</button>'
              ),
              (
                  '<div class="badge" id="decisionBadge">DECISÃO 1/20</div>',
                  '<div class="badge" id="decisionBadge">DECISÃO 1/6</div>'
              ),
              (
                  'started:false, decision:0, maxDecisions:20, month:0, year:2026,',
                  'started:false, decision:0, maxDecisions:6, month:0, year:2026,'
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected source not found: {old[:120]}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: sharpen NOISE executive demo funnel"
            git push
          fi

name: Improve NOISE mobile gameplay

on:
  push:
    paths:
      - '.github/workflows/mobile-game-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve mobile game UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="noise-mobile-game-ux">'
          if marker in s:
              raise SystemExit('Mobile game UX CSS already present')
          css = '''
          <style id="noise-mobile-game-ux">
          @media (max-width:900px){
            .screen{display:flex!important;flex-direction:column!important;gap:8px!important;padding:8px!important}
            .screen>.col:nth-child(2){order:1!important}
            .screen>.col:nth-child(1){order:2!important}
            .screen>.col:nth-child(3){order:3!important}
            header{position:sticky!important;top:0!important;z-index:20!important}
            .brand small{display:none!important}
            .head-right .badge{font-size:8px!important;padding:5px!important}
            .event-panel{padding:0!important;border:0!important;background:transparent!important}
            .event{padding:12px!important;border-radius:12px!important}
            .eyebrow{font-size:9px!important}
            .event h2{font-size:20px!important;line-height:1.12!important;margin:4px 0 6px!important}
            .event p{font-size:12px!important;line-height:1.38!important;margin:5px 0!important}
            .tags{margin:4px 0!important}
            .tag{font-size:8px!important}
            .choices{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;margin-top:10px!important}
            .choice{min-height:56px!important;padding:12px!important;font-size:12px!important;line-height:1.3!important;border-radius:11px!important}
            .outcome{font-size:11px!important;line-height:1.35!important;padding:9px!important}
            .controls{padding-top:0!important;overflow:visible!important}
            .controls-head{position:static!important;padding:8px 0 6px!important}
            .controls-head h3{font-size:12px!important}
            .levers{grid-template-columns:1fr 1fr!important;gap:7px!important}
            .lever{padding:9px!important}
            .lever label{font-size:10px!important}
            .lever small{font-size:8px!important;line-height:1.2!important;margin:3px 0 6px!important}
            .lever-row button{width:32px!important;height:32px!important}
            .lever-val{font-size:12px!important}
            .budget-row{grid-template-columns:1fr 1fr!important;gap:7px!important}
            .screen>.col:nth-child(1) .panel,.screen>.col:nth-child(3) .panel{padding:10px!important}
            .kpis{grid-template-columns:1fr 1fr!important;gap:6px!important}
            .kpi{padding:8px!important}
            .kpi small{font-size:8px!important}
            .kpi b{font-size:12px!important}
            .big{font-size:22px!important}
            .metric-head{font-size:9px!important}
            .timeline{max-height:none!important;height:auto!important}
            .world-grid{grid-template-columns:1fr 1fr!important}
            .footer{justify-content:center!important;padding-bottom:10px!important}
          }
          @media (max-width:430px){
            .event h2{font-size:19px!important}
            .choice{font-size:11px!important}
            .levers{grid-template-columns:1fr 1fr!important}
            .lever small{display:none!important}
            .lever{padding:8px!important}
            .budget-row{grid-template-columns:1fr 1fr!important}
          }
          </style>
          '''
          css = '\n'.join(line[10:] if line.startswith('          ') else line for line in css.splitlines())
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit mobile game UX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve NOISE mobile gameplay layout"
          git push

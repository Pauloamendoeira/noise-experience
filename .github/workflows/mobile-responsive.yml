name: Mobile responsive NOISE Experience

on:
  push:
    paths:
      - '.github/workflows/mobile-responsive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile responsive CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="noise-mobile-responsive">'
          if marker in s:
              raise SystemExit('Mobile responsive CSS already present')
          css = '''
          <style id="noise-mobile-responsive">
          @media (max-width:900px){
            html,body{height:auto!important;min-height:100%;overflow:auto!important}
            #app{height:auto!important;min-height:100vh!important;overflow:visible!important}
            header{height:50px!important;min-height:50px!important;padding:0 10px!important}
            .brand-mark{width:30px!important;height:30px!important}
            .brand h1{font-size:14px!important}
            .brand small{font-size:9px!important}
            .head-right{gap:4px!important}
            .badge{font-size:9px!important;padding:5px 6px!important}
            .head-right button{display:none!important}
            .screen{height:auto!important;min-height:calc(100vh - 50px)!important;display:grid!important;grid-template-columns:1fr!important;gap:8px!important;padding:8px!important;overflow:visible!important}
            .col{overflow:visible!important;min-height:auto!important}
            .panel{overflow:visible!important}
            .choices{grid-template-columns:1fr!important}
            .choice{min-height:44px!important;font-size:11px!important}
            .levers{grid-template-columns:1fr 1fr!important}
            .lever label{font-size:10px!important}
            .lever small{font-size:8px!important;display:block!important}
            .budget-row{grid-template-columns:1fr 1fr!important}
            .timeline{max-height:280px!important}
            #intro.overlay{align-items:flex-start!important;justify-content:center!important;padding:8px!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch}
            #intro .card{width:100%!important;max-width:560px!important;margin:6px auto 14px!important;padding:15px!important;border-radius:13px!important}
            #intro .card>div:first-child{gap:8px!important;margin-bottom:8px!important}
            #intro .card>div:first-child img{width:48px!important;height:48px!important;border-radius:9px!important}
            #intro .card h1{font-size:26px!important;line-height:1!important;margin:0 0 4px!important}
            #intro .card>div:first-child div div{font-size:14px!important;line-height:1.2!important}
            #intro .card h2{font-size:22px!important;line-height:1.08!important;margin:8px 0!important}
            #intro .card p{font-size:13px!important;line-height:1.35!important;margin:8px 0!important}
            #intro .card>div:nth-of-type(2){gap:6px!important;margin:9px 0!important}
            #intro .card>div:nth-of-type(2)>div{padding:8px!important}
            #intro .card>div:nth-of-type(2)>div>div:first-child{font-size:9px!important;margin-bottom:3px!important}
            #intro .card>div:nth-of-type(2)>div>div:last-child{font-size:10px!important;line-height:1.3!important}
            #intro .card p[style*="font-size:11px"]{font-size:10px!important;line-height:1.3!important;margin:7px 0!important}
            #intro .start{display:block!important;width:100%!important;padding:11px 12px!important;font-size:14px!important;margin-top:6px!important}
            #snapshot.snapshot{overflow-y:auto!important;padding:8px!important}
            #snapshot .snapshot-inner{height:auto!important;min-height:100%!important;display:block!important;padding:0!important}
            #snapshot .snapshot-inner h1{font-size:18px!important;line-height:1.08!important;margin:0 0 6px!important}
            #snapshot .noise-result-grid{grid-template-columns:1fr!important;gap:8px!important}
            #snapshot .noise-risk-grid{grid-template-columns:1fr!important}
            #snapshot .snap-grid{grid-template-columns:1fr!important}
            #snapshot .noise-result-left,#snapshot .noise-result-right{gap:7px!important}
            #snapshot .noise-card,#snapshot .noise-alert,#snapshot .noise-cost,#snapshot .noise-provoke{padding:9px!important}
            #snapshot .question{margin-top:8px!important;padding:10px!important}
            #snapshot .cta{flex-direction:column!important;gap:6px!important;margin-top:8px!important}
            #snapshot .cta button{width:100%!important}
          }
          @media (max-width:430px){
            #intro .card{padding:13px!important}
            #intro .card h1{font-size:24px!important}
            #intro .card h2{font-size:20px!important}
            #intro .card p{font-size:12px!important}
            #intro .card>div:nth-of-type(2){grid-template-columns:1fr 1fr!important}
            .levers{grid-template-columns:1fr!important}
          }
          </style>
          '''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          print('Mobile responsive CSS added')
          PY
      - name: Commit mobile responsive source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make NOISE Experience responsive on mobile"
          git push

name: Run NOISE Sales Finalize
on:
  push:
    paths:
      - '.github/workflows/run-sales-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch_sales_finalize.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: finalize NOISE sales conversion"
            git push
          fi

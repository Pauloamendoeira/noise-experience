name: Run NOISE Snapshot Compact V2
on:
  push:
    paths: ['.github/workflows/run-snapshot-compact-v2.yml']
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch_snapshot_compact.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: compact NOISE Snapshot into columns"
            git push
          fi

name: Patch NOISE Snapshot no money

on:
  push:
    paths:
      - '.github/workflows/patch-snapshot-no-money.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Snapshot
        run: python scripts/patch_snapshot.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove financial metrics from NOISE Snapshot"
          git push
